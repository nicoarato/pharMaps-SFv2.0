name: Consultar turnos Santa Fe y Santo Tomé

on:
  schedule:
    # 09:17 de Argentina, todos los días para mantener el respaldo diario.
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: ['automation/consulta-turnos']
    paths:
      - '.github/workflows/consultar-turnos.yml'
      - 'helpers/turnos-monitor/**'
      - 'helpers/turnos-ocr/scripts/extract-santa-fe.mjs'
      - 'helpers/turnos-ocr/package*.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  consultar:
    # Los primeros runners Linux agotaron la conexión al Colegio.
    # El diagnóstico en macOS pudo acceder a la portada y al PDF.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fuentes y comparar con referencia
        continue-on-error: true
        run: python helpers/turnos-monitor/check.py --source santa-fe
      - name: Verificar importadores
        id: tests
        if: always()
        run: python -m unittest discover -s helpers/turnos-monitor -p 'test_import_*.py'
      - uses: actions/setup-node@v4
        continue-on-error: true
        if: always()
        with:
          node-version: '24'
      - name: Instalar herramientas OCR
        id: ocr_dependencies
        continue-on-error: true
        if: always()
        run: npm ci --prefix helpers/turnos-ocr
      - name: Leer bloques de Santa Fe con tres variantes OCR
        id: ocr
        continue-on-error: true
        if: always() && steps.ocr_dependencies.outcome == 'success'
        run: node helpers/turnos-ocr/scripts/extract-santa-fe.mjs turnos-report/santa-fe-0.pdf turnos-report/santa-fe-ocr
      - name: Conciliar Santa Fe y preparar alternativas de lecturas dudosas
        id: santa_fe
        continue-on-error: true
        if: always() && steps.ocr.outcome == 'success'
        run: python helpers/turnos-monitor/import_santa_fe.py --apply
      - name: Leer los nueve bloques de Santo Tomé con tres variantes OCR
        id: ocr_santo_tome
        continue-on-error: true
        if: always() && steps.ocr_dependencies.outcome == 'success'
        run: node helpers/turnos-ocr/scripts/extract-santa-fe.mjs turnos-report/santa-fe-0.pdf turnos-report/santo-tome-ocr santo-tome
      - name: Conciliar Santo Tomé y preparar alternativas de lecturas dudosas
        id: santo_tome
        continue-on-error: true
        if: always() && steps.ocr_santo_tome.outcome == 'success'
        run: python helpers/turnos-monitor/import_santa_fe.py --locality santo-tome --input turnos-report/santo-tome-ocr/ocr.json --apply
      - name: Usar El Litoral para Santa Fe si falta el afiche vigente
        id: fallback_santa_fe
        if: always() && steps.tests.outcome == 'success'
        run: python helpers/turnos-monitor/import_litoral.py --locality santa-fe --apply
      - name: Usar El Litoral para Santo Tomé si falta el afiche vigente
        id: fallback_santo_tome
        if: always() && steps.tests.outcome == 'success'
        run: python helpers/turnos-monitor/import_litoral.py --locality santo-tome --apply
      - name: Preparar Pull Request de Santa Fe y Santo Tomé
        if: always() && steps.tests.outcome == 'success' && steps.fallback_santa_fe.outcome == 'success' && steps.fallback_santo_tome.outcome == 'success' && github.event_name != 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.ref_name }}
          branch: automation/turnos-santa-fe
          add-paths: src/assets/data/turnos-colegio-agosto-2026.json
          commit-message: 'Actualizar turnos de Santa Fe y Santo Tomé'
          title: 'Actualizar turnos de Santa Fe y Santo Tomé'
          body: 'Actualización de turnos validados de Santa Fe y Santo Tomé. El afiche vigente tiene prioridad; si falta, se usa El Litoral con cobertura parcial de las fechas publicadas. Este PR incluye únicamente el JSON de la app. PDF, HTML, candidatos, advertencias e imágenes se conservan en el artifact de Actions durante 14 días. Los datos dudosos no se importan. Revisar las fechas y el informe antes de publicar.'
          draft: true
      - name: Guardar informe y publicaciones descargadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consulta-colegio-${{ github.run_id }}
          path: turnos-report/
          retention-days: 14
